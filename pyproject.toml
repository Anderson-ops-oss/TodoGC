# pyproject.toml — the project manifest: metadata, build backend, the todogc command entry
# point, and tool configuration.

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "todogc"
version = "0.12.0"
description = "Treats your todo list as a program's heap, and uses GC to coldly reclaim the zombie tasks you'll never actually do."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anderson", email = "u3606584@connect.hku.hk" }]
keywords = ["todo", "gc", "garbage-collection", "cli", "productivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
# Zero dependencies at the core: standard library only (sqlite3 / argparse / dataclasses / datetime).
dependencies = []

[project.urls]
Homepage = "https://github.com/Anderson-ops-oss/TodoGC"
Documentation = "https://github.com/Anderson-ops-oss/TodoGC#usage-guide"
Repository = "https://github.com/Anderson-ops-oss/TodoGC"
Issues = "https://github.com/Anderson-ops-oss/TodoGC/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=6.1", "ruff>=0.8", "basedpyright>=1.31"]  # tests, packaging, and static checks
color = ["rich>=13"]                 # optional: colored output when installed, core doesn't depend on it
web = ["streamlit>=1.30", "Pillow>=10.1"]  # optional: Web UI and PNG review downloads
export = ["Pillow>=10.1"]           # optional: PNG share cards; SVG needs no dependencies

[project.scripts]
# Once installed, just type `todogc gc` directly — no need for python -m todogc.cli.
todogc = "todogc.cli:main"

[tool.setuptools]
packages = ["todogc", "todogc.locales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep the original Pyflakes / syntax checks stable across Ruff default changes.
select = ["E4", "E7", "E9", "F"]

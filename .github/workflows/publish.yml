name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check todogc tests scripts
      - run: basedpyright
      - run: pytest

  build:
    name: Build and check distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          module = ast.parse(Path("todogc/__init__.py").read_text())
          runtime_version = next(
              ast.literal_eval(node.value) for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
          )
          if version != runtime_version:
              raise SystemExit("pyproject.toml and todogc.__version__ must match")
          if os.environ["GITHUB_EVENT_NAME"] == "release" and os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"The release tag must be v{version}")
          print(f"Validated todogc {version}")
          PY
      - name: Check release commit is on main
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel outside the checkout
        run: python scripts/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      github.repository == 'Anderson-ops-oss/TodoGC'
    runs-on: ubuntu-latest
    # The PyPI trusted publisher has no environment name; do not add environment here.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - name: Upload to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
